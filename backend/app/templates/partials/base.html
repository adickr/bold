<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Fortuner Agent{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">Fortuner Agent</a>
      <nav>
        <a href="/" class="{% if page == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/listings" class="{% if page == 'listings' %}active{% endif %}">Listings</a>
        <a href="/shortlist" class="{% if page == 'shortlist' %}active{% endif %}">Shortlist</a>
        <a href="/api/docs" target="_blank" rel="noreferrer">API</a>
      </nav>
      <span class="user">{{ user }}</span>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">
      Private buying tool · Asking prices only, not confirmed selling prices ·
      Scores and motivation levels are inferred estimates
    </footer>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
