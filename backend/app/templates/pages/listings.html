{% extends "partials/base.html" %}
{% block title %}Listings · Fortuner Agent{% endblock %}
{% block content %}
<section class="section-head">
  <h1>Listings</h1>
  <p class="lede">Filter tracked Fortuners across all sources.</p>
</section>

<form class="filters" method="get" action="/listings">
  <label>Max price <input type="number" name="max_price" value="{{ filters.max_price or '' }}" placeholder="700000" /></label>
  <label>Max km <input type="number" name="max_mileage" value="{{ filters.max_mileage or '' }}" placeholder="100000" /></label>
  <label>Min year <input type="number" name="min_year" value="{{ filters.min_year or '' }}" placeholder="2018" /></label>
  <label>Variant <input type="text" name="variant" value="{{ filters.variant or '' }}" placeholder="VX / GR-S" /></label>
  <label>Province <input type="text" name="province" value="{{ filters.province or '' }}" placeholder="Gauteng" /></label>
  <label>Dealer <input type="text" name="dealer" value="{{ filters.dealer or '' }}" /></label>
  <label>Min score <input type="number" step="0.1" name="min_deal_score" value="{{ filters.min_deal_score or '' }}" /></label>
  <label class="check"><input type="checkbox" name="has_reduction" value="true" {% if filters.has_reduction %}checked{% endif %} /> Reduced</label>
  <label class="check"><input type="checkbox" name="new_only" value="true" {% if filters.new_only %}checked{% endif %} /> New</label>
  <label class="check"><input type="checkbox" name="shortlisted" value="true" {% if filters.shortlisted %}checked{% endif %} /> Shortlisted</label>
  <label class="check"><input type="checkbox" name="stretch" value="true" {% if filters.stretch %}checked{% endif %} /> Stretch</label>
  <label class="grow">Search <input type="text" name="q" value="{{ filters.q or '' }}" placeholder="dealer, trim, location" /></label>
  <button type="submit">Apply</button>
</form>

{% include "partials/vehicle_table.html" %}
{% endblock %}
