services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fortuner
      POSTGRES_PASSWORD: fortuner
      POSTGRES_DB: fortuner
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortuner -d fortuner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://fortuner:fortuner@db:5432/fortuner
      COLLECTOR_MODE: ${COLLECTOR_MODE:-fixture}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      ALERT_PROVIDER: ${ALERT_PROVIDER:-log}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
